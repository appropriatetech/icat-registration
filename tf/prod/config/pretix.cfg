[pretix]
instance_name = ICAT Registration
url = ${site_url}
currency = USD
datadir = /data
trust_x_forwarded_for = on
trust_x_forwarded_proto = on
registration = off
logging = INFO

[database]
backend = postgresql
name = ${db_name}
user = ${db_user}
password = ${db_password}
host = ${db_host}
port = 5432
sslmode = prefer
sslrootcert =
sslcert =
sslkey =

[redis]
location = redis://${redis_host}:${redis_port}/0
sessions = true

[django]
secret = ${django_secret}
debug = off

[mail]
from = ${mail_from}
host = ${mail_host}
user = ${mail_user}
password = ${mail_password}
port = ${mail_port}
tls = ${mail_tls}
ssl = ${mail_ssl}
admins = ${mail_from}
custom_sender_address_allowed = off
